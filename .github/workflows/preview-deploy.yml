name: Preview Deploy

on:
  pull_request:
    paths:
      - 'workspace-dashboard/**'
      - 'package-lock.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Build dashboard with PR-specific base path
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: cd workspace-dashboard && npx vite build --base="/ContextOS/pr-${PR_NUMBER}/"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./workspace-dashboard/dist
          destination_dir: pr-${{ github.event.number }}
          keep_files: true

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          header: preview-deploy
          message: |
            ## Preview Deployment

            Your dashboard preview is ready:
            https://sairam0424.github.io/ContextOS/pr-${{ github.event.number }}/
